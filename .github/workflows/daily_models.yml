name: Daily Meteorological Processing

on:
  schedule:
    # Attempt 1: 9:00 UTC (3:00 AM Mountain)
    # Attempt 2: 10:30 UTC (4:30 AM Mountain)
    # Attempt 3: 12:00 UTC (6:00 AM Mountain)
    - cron: "00 9,12 * * * "
    - cron: "30 10 * * * "
  workflow_dispatch:

concurrency:
  group: daily-met-modeling
  cancel-in-progress: false # Let an active run finish completely before the next check runs

jobs:
  update_daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install all heavy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev libcairo2-dev \
            libgit2-dev libglpk-dev libtiff-dev libfftw3-dev libgdal-dev libgeos-dev libproj-dev \
            libv8-dev libudunits2-dev pkg-config \
            libeccodes-dev libnetcdf-dev

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set RETICULATE_PYTHON env var
        run: echo "RETICULATE_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $GITHUB_ENV

      - name: Install required Python packages
        run: |
          pip install --upgrade pip
          pip install s3fs xarray metpy boto3 numcodecs numpy zarr==3.1.1 virtualenv cfgrib netcdf4 pydap
      
      # --- ADD THESE TWO RENV STEPS HERE ---
      - name: Cache renv packages
        id: cache-renv
        uses: actions/cache@v3
        with:
          path: |
            renv/library
            ~/.cache/R/renv
          key: ${{ runner.os }}-R-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-R-

      - name: Restore renv packages
        if: steps.cache-renv.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cran.rstudio.com")'
          Rscript -e 'renv::restore()'
      # -------------------------------------

      - name: Run heavy model processing script
        run: Rscript UPDATE_DAILY_MODELS.R

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          # This will only push if actual modifications occurred during a successful download
          git commit --amend -m "Automated daily meteorological update" || echo "No changes to commit"
          git push --force origin main
